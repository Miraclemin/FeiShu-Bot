<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">从飞书群到本机 Agent</title>
  <desc id="desc">创建者在群里提出任务，工作台提供群配置，本机 Agent 执行后把结果回复到原群。</desc>
  <rect width="1200" height="390" rx="24" fill="#f6f8fc"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" text-anchor="middle">
    <g id="feishu-group">
      <rect x="48" y="64" width="320" height="184" rx="20" fill="#ffffff" stroke="#dce4ef" stroke-width="2"/>
      <text x="208" y="134" font-size="44" font-weight="650" fill="#172338">飞书群</text>
      <text x="208" y="198" font-size="36" fill="#54657b">创建者发起任务</text>
    </g>
    <g id="desktop-workbench">
      <rect x="440" y="64" width="320" height="184" rx="20" fill="#eaf1ff" stroke="#b6cdfb" stroke-width="2"/>
      <text x="600" y="134" font-size="44" font-weight="650" fill="#2459b3">桌面工作台</text>
      <text x="600" y="198" font-size="36" fill="#365b91">加载本群配置</text>
    </g>
    <g id="local-agent">
      <rect x="832" y="64" width="320" height="184" rx="20" fill="#ffffff" stroke="#dce4ef" stroke-width="2"/>
      <text x="992" y="134" font-size="44" font-weight="650" fill="#172338">本机 Agent</text>
      <text x="992" y="198" font-size="36" fill="#54657b">执行项目任务</text>
    </g>
    <text x="600" y="344" font-size="38" fill="#365b91">结果回复原群，继续讨论下一步</text>
  </g>
  <g fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M384 156h38m-12-12 12 12-12 12"/>
    <path d="M776 156h38m-12-12 12 12-12 12"/>
    <path d="M992 264v24H208v-24m-10 10 10-10 10 10"/>
  </g>
</svg>
