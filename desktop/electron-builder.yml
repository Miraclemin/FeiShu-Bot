appId: com.miraclemin.feishu-collaborator
productName: feishu-collaborator
artifactName: feishu-collaborator-${version}-${os}-${arch}.${ext}
extraMetadata:
  main: desktop/main.cjs
files:
  - dist/**
  - desktop/main.cjs
  - desktop/preload.cjs
  - resources/**
  - package.json
asar: true
asarUnpack:
  - resources/**
mac:
  identity: "-"
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
directories:
  output: desktop-release
