appId: com.miraclemin.feishu-collaborator
productName: feishu-collaborator
artifactName: feishu-collaborator-${version}-${os}-${arch}.${ext}
extraMetadata:
  main: desktop/main.cjs
files:
  - dist/**
  - desktop/main.cjs
  - desktop/preload.cjs
  - desktop/meeting-setup.cjs
  - desktop/permission-setup.cjs
  - resources/**
  - "!resources/mascots/*-generation.json"
  - package.json
asar: true
asarUnpack:
  - resources/**
mac:
  icon: resources/branding/icon.icns
  identity: "-"
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
win:
  icon: resources/branding/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
directories:
  output: desktop-release
