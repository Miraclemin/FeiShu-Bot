name: Desktop packages
on:
  workflow_dispatch:
  push:
    tags: ['v*', 'workbench-v*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm exec tsc -p web/tsconfig.json --noEmit
      - run: pnpm test
      - run: pnpm test:desktop

      - run: pnpm build
      - run: pnpm exec electron-builder --config desktop/electron-builder.yml --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: workbench-${{ matrix.os }}
          if-no-files-found: error
          path: |
            desktop-release/*.dmg
            desktop-release/*.exe
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: workbench-*
          merge-multiple: true
          path: installers
      - name: Checksums
        working-directory: installers
        run: sha256sum *.dmg *.exe > SHA256SUMS.txt
      - name: Attach installers to draft or published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release upload "$RELEASE_TAG" installers/* --clobber
