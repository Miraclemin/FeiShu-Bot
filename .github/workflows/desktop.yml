name: Desktop packages
on:
  workflow_dispatch:
  push:
    tags: ['workbench-v*']
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm exec tsc -p web/tsconfig.json --noEmit
      - run: pnpm test
      - run: pnpm desktop:dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: workbench-${{ matrix.os }}
          path: |
            desktop-release/*.dmg
            desktop-release/*.exe
